server:
  port: ${PORT:8095}

spring:
  application:
    name: nettriage
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: always

nettriage:
  window-quiet: ${WINDOW_QUIET:2s}
  replay-enabled: ${REPLAY_ENABLED:true}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
    topic: ${HEALTH_TOPIC:tunnel.health}
    group-id: ${KAFKA_GROUP:nettriage}
  edgefleet:
    url: ${EDGEFLEET_URL:}
    poll-interval: 2s
    devices-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    org.apache.kafka: WARN
